<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SalinTala</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/auth.css" rel="stylesheet">
  <script src="../js/app.js"></script>
</head>
<body class="auth">
  <div class="auth-top"><button class="icon-btn" id="theme" title="Toggle theme"><i class="bi bi-moon-stars"></i></button></div>
  <div class="shell">
    <div class="hello en" aria-hidden="true"><b>EN</b>Good morning</div>
    <div class="hello fil" aria-hidden="true"><b>FIL</b>Magandang umaga</div>
    <div class="hello ceb" aria-hidden="true"><b>CEB</b>Maayong buntag</div>
    <a class="lockup" href="../index.html"><img src="../images/logo.svg" alt="" width="42" height="42">SalinTala</a>
    <div class="cardx sheet">
      <div class="switch"><span class="on">Login</span><a href="signup.html">Sign up</a></div>
      <h2>Welcome back</h2>
      <p class="muted mb-4">Log in to your SalinTala account</p>

      <div class="alert alert-success py-2 small d-none" id="ok" role="status">Account created. You can log in now.</div>
      <div class="alert alert-danger py-2 small d-none" id="err" role="alert"></div>

      <form id="form">
        <label for="email" class="form-label small fw-semibold">Email</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="you@ustp.edu.ph" required>
        </div>

        <label for="password" class="form-label small fw-semibold">Password</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Your password" style="border-radius:0" required>
          <span class="input-group-text pw-toggle" id="toggle" role="button" tabindex="0">Show</span>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label small" for="remember">Remember me</label>
        </div>

        <button type="submit" class="go go-lg w-100" id="btn">
          <span id="btnText">Login</span><i class="bi bi-arrow-right"></i>
        </button>
      </form>
      <div class="fine">New here? <a href="signup.html" class="fw-semibold">Create an account</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var pw = $("password"), tg = $("toggle");
    function flip() { var show = pw.type === "password"; pw.type = show ? "text" : "password"; tg.textContent = show ? "Hide" : "Show"; }
    tg.addEventListener("click", flip);
    tg.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });

    if (location.search.indexOf("registered=1") > -1) $("ok").classList.remove("d-none");

    function showError(msg) { $("ok").classList.add("d-none"); $("err").textContent = msg; $("err").classList.remove("d-none"); }
    function busy(on) {
      var btn = $("btn"); btn.disabled = on;
      $("btnText").textContent = on ? "Logging in..." : "Login";
      btn.querySelector("i").outerHTML = '<i class="bi bi-' + (on ? "arrow-repeat spin" : "arrow-right") + '"></i>';
    }

    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      $("err").classList.add("d-none"); busy(true);
      SalinAuth.login($("email").value, pw.value, $("remember").checked)
        .then(function () { location.href = "dashboard.html"; })
        .catch(function (err) { busy(false); showError(err.message); });
    });
  </script>
</body>
</html>
