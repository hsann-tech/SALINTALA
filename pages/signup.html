<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | SalinTala</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/auth.css" rel="stylesheet">
  <script src="../js/app.js"></script>
</head>
<body class="auth">
  <div class="auth-top"><button class="icon-btn" id="theme" title="Toggle theme"><i class="bi bi-moon-stars"></i></button></div>
  <div class="shell">
    <div class="hello en" aria-hidden="true"><b>EN</b>Good morning</div>
    <div class="hello fil" aria-hidden="true"><b>FIL</b>Magandang umaga</div>
    <div class="hello ceb" aria-hidden="true"><b>CEB</b>Maayong buntag</div>
    <a class="lockup" href="../index.html"><img src="../images/logo.svg" alt="" width="42" height="42">SalinTala</a>
    <div class="cardx sheet">
      <div class="switch"><a href="login.html">Login</a><span class="on">Sign up</span></div>
      <h2>Create account</h2>
      <p class="muted mb-4">Start turning lectures into notes</p>

      <div class="alert alert-danger py-2 small d-none" id="err" role="alert"></div>

      <form id="form">
        <label for="name" class="form-label small fw-semibold">Full name</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="name" placeholder="Juan Dela Cruz" required>
        </div>

        <label for="email" class="form-label small fw-semibold">Email</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="you@ustp.edu.ph" required>
        </div>

        <label for="password" class="form-label small fw-semibold">Password</label>
        <div class="input-group mb-2">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" minlength="6" placeholder="At least 6 characters" required>
        </div>
        <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div>
        <div class="meter-note" id="mnote"></div>

        <label for="confirm" class="form-label small fw-semibold">Confirm password</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
          <input type="password" class="form-control" id="confirm" minlength="6" placeholder="Repeat password" required>
        </div>

        <button type="submit" class="go go-lg w-100 mt-2" id="btn">
          <span id="btnText">Sign Up</span><i class="bi bi-arrow-right"></i>
        </button>
      </form>
      <div class="fine">Already registered? <a href="login.html" class="fw-semibold">Login to your account</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    function showError(msg) { $("err").textContent = msg; $("err").classList.remove("d-none"); }
    function busy(on) {
      var btn = $("btn"); btn.disabled = on;
      $("btnText").textContent = on ? "Creating account..." : "Sign Up";
      btn.querySelector("i").outerHTML = '<i class="bi bi-' + (on ? "arrow-repeat spin" : "arrow-right") + '"></i>';
    }

    var COLORS = ["#ef4444", "#f59e0b", "#84cc16", "#22c55e"], WORDS = ["Too short", "Weak", "Good", "Strong"];
    $("password").addEventListener("input", function () {
      var p = this.value, n = 0;
      if (p.length >= 6) n++;
      if (p.length >= 10) n++;
      if (/[A-Z]/.test(p) && /[a-z]/.test(p)) n++;
      if (/\d/.test(p) && /[^A-Za-z0-9]/.test(p)) n++;
      var bars = $("meter").children, k = Math.max(n, 1);
      for (var i = 0; i < 4; i++) bars[i].style.background = p && i < k ? COLORS[k - 1] : "";
      $("mnote").textContent = p ? WORDS[k - 1] : "";
    });

    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      $("err").classList.add("d-none");
      if ($("password").value !== $("confirm").value) { showError("Passwords do not match."); return; }
      busy(true);
      SalinAuth.signup($("name").value, $("email").value, $("password").value)
        .then(function () { location.href = "login.html?registered=1"; })
        .catch(function (err) { busy(false); showError(err.message); });
    });
  </script>
</body>
</html>
