<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Transcripts | SalinTala</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script src="../js/app.js"></script>
  <style>
    /* Transcripts: each saved lesson is a "page" whose spine shows its language mix */
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
    .page { position: relative; display: flex; flex-direction: column; padding: 22px 22px 18px 30px; border-radius: 22px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s, border-color .2s; }
    .page:hover { transform: translateY(-4px) rotate(-.4deg); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
    .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; display: flex; flex-direction: column; }
    .spine i { display: block; width: 100%; }
    .page h3 { font-size: 1.08rem; font-weight: 800; letter-spacing: -.2px; margin: 0 0 4px; }
    .page .when { color: var(--muted); font-size: .82rem; }
    .snip { margin: 14px 0; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: .92rem; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); }
    .snip::before { content: "\201C"; color: var(--brand); font-weight: 800; margin-right: 2px; }
    .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: .82rem; margin-bottom: 14px; }
    .facts .chk { color: #d97706; font-weight: 700; } .facts .good { color: #16a34a; font-weight: 700; }
    .page .acts { margin-top: auto; display: flex; gap: 6px; align-items: center; }
    .page .acts .open { flex: 1; }
    .page .acts .del:hover { border-color: #ef4444; color: #ef4444; box-shadow: none; }
    .sample { font-size: .68rem; font-weight: 700; padding: 2px 9px; border-radius: 50rem; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); margin-left: 6px; vertical-align: middle; }

    .topline { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: baseline; margin-bottom: 18px; }
    .topline b { font-size: 1.9rem; font-weight: 800; letter-spacing: -1px; margin-right: 6px; font-variant-numeric: tabular-nums; }
    .topline span { color: var(--muted); font-weight: 600; }
    .bar2 { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 22px; }
    .bar2 .form-select { width: auto; }
    .bar2 .input-group { max-width: 300px; }
    .pillbar button.active.f-en { color: var(--en); } .pillbar button.active.f-fil { color: #d97706; } .pillbar button.active.f-ceb { color: var(--ceb); }
    .none { text-align: center; padding: 60px 10px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">

      <nav class="col-md-3 col-lg-2 sidebar">
        <a class="brand align-items-center" href="../index.html">
          <img src="../images/logo.svg" alt="" width="30" height="30" class="me-2">SalinTala
        </a>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="transcribe.html"><i class="bi bi-upload me-2"></i>New Transcription</a></li>
          <li class="nav-item"><a class="nav-link active" href="transcripts.html"><i class="bi bi-journal-text me-2"></i>My Transcripts</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html"><i class="bi bi-chat-square-text me-2"></i>Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
          <li class="nav-item mt-3"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
        </ul>
      </nav>

      <main class="col-md-9 col-lg-10 p-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
          <div>
            <h2 class="fw-bold mb-0">My Transcripts</h2>
            <span class="muted">Your saved classroom transcripts</span>
          </div>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <button class="icon-btn" id="theme" title="Toggle theme" style="background:var(--surface);border-color:var(--line);color:var(--ink)"><i class="bi bi-moon-stars"></i></button>
            <a href="profile.html" class="user-chip" data-user-chip title="Open profile">
              <img src="../images/avatar.svg" alt=""><span class="user-name">Account</span>
            </a>
            <a href="transcribe.html" class="btn btn-brand"><i class="bi bi-plus-lg me-1"></i> New Transcription</a>
          </div>
        </div>

        <div class="topline">
          <div><b id="count">0</b><span>transcripts</span></div>
          <div><b id="tSeg">0</b><span>segments</span></div>
          <div><b id="tChk">0</b><span>words to verify</span></div>
        </div>

        <div class="bar2">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="q" class="form-control" placeholder="Search by title">
          </div>
          <div class="pillbar" id="flt">
            <button class="active" data-l="">All</button>
            <button class="f-en" data-l="en">EN</button>
            <button class="f-fil" data-l="fil">FIL</button>
            <button class="f-ceb" data-l="ceb">CEB</button>
          </div>
          <select id="sort" class="form-select ms-auto" aria-label="Sort transcripts">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="az">Title A to Z</option>
          </select>
        </div>

        <div class="shelf" id="rows"></div>

        <div class="none d-none" id="empty">
          <img src="../images/empty-transcript.svg" alt="" width="140" class="mb-2">
          <div class="fw-bold">No transcripts found</div>
          <div class="small">Try another search, or create one from <a href="transcribe.html">New Transcription</a>.</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Viewer -->
  <div class="modal fade" id="view" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <div><h5 class="modal-title fw-bold" id="vTitle"></h5><small class="muted" id="vMeta"></small></div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="vBody"></div>
        <div class="modal-footer">
          <button class="tool" id="vCopy"><i class="bi bi-clipboard me-1"></i>Copy</button>
          <button class="tool" id="vDl"><i class="bi bi-download me-1"></i>.txt</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var LABEL = { en: "EN", fil: "FIL", ceb: "CEB" }, COLOR = { en: "var(--en)", fil: "var(--fil)", ceb: "var(--ceb)" }, current = null, lang = "";
    var h = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
    var fmt = function (s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
    var clean = function (t) { return t.replace(/\[\[|\]\]/g, ""); };
    var checks = function (t) { return t.data.reduce(function (n, d) { return n + (String(d[2]).match(/\[\[/g) || []).length; }, 0); };
    var has = function (t, l) { return t.data.some(function (x) { return x[1] === l; }); };
    var asText = function (t) { return t.title + "\n\n" + t.data.map(function (d) { return "[" + fmt(d[0]) + "] (" + LABEL[d[1]] + ") " + clean(d[2]); }).join("\n"); };
    // Spine: stacked colour bar sized by how many segments are in each language
    var spine = function (d) {
      var c = { en: 0, fil: 0, ceb: 0 }; d.forEach(function (x) { if (c[x[1]] !== undefined) c[x[1]]++; });
      return ["en", "fil", "ceb"].filter(function (l) { return c[l]; })
        .map(function (l) { return '<i style="flex:' + c[l] + ';background:' + COLOR[l] + '" title="' + LABEL[l] + '"></i>'; }).join("");
    };
    var tags = function (d) {
      return ["en", "fil", "ceb"].filter(function (l) { return d.some(function (x) { return x[1] === l; }); })
        .map(function (l) { return '<span class="tag tag-' + l + '">' + LABEL[l] + '</span>'; }).join(" ");
    };

    function render() {
      var q = $("q").value.trim().toLowerCase(), all = SalinStore.transcripts();
      var items = all.filter(function (t) { return (!q || t.title.toLowerCase().indexOf(q) > -1) && (!lang || has(t, lang)); });
      var s = $("sort").value;
      items.sort(function (a, b) {
        return s === "az" ? a.title.localeCompare(b.title) : s === "old" ? new Date(a.created) - new Date(b.created) : new Date(b.created) - new Date(a.created);
      });
      $("count").textContent = items.length;
      $("tSeg").textContent = items.reduce(function (n, t) { return n + t.data.length; }, 0);
      $("tChk").textContent = items.reduce(function (n, t) { return n + checks(t); }, 0);
      $("empty").classList.toggle("d-none", items.length > 0);
      $("rows").innerHTML = items.map(function (t) {
        var n = checks(t), last = t.data.length ? t.data[t.data.length - 1][0] : 0, first = t.data.length ? clean(String(t.data[0][2])) : "";
        return '<article class="page"><div class="spine">' + spine(t.data) + '</div>' +
          '<div class="d-flex justify-content-between gap-2 mb-1"><div>' + tags(t.data) + '</div></div>' +
          '<h3>' + h(t.title) + (t.sample ? '<span class="sample">Sample</span>' : '') + '</h3>' +
          '<div class="when">' + new Date(t.created).toLocaleDateString() + '</div>' +
          '<div class="snip">' + h(first.slice(0, 140)) + '</div>' +
          '<div class="facts"><span><i class="bi bi-volume-down me-1"></i>' + h(t.condition || "-") + '</span>' +
          '<span><i class="bi bi-clock me-1"></i>' + fmt(last) + '</span>' +
          (n ? '<span class="chk"><i class="bi bi-exclamation-triangle me-1"></i>' + n + ' to verify</span>' : '<span class="good"><i class="bi bi-check2-circle me-1"></i>All clear</span>') + '</div>' +
          '<div class="acts"><button class="tool open" data-a="view" data-id="' + t.id + '"><i class="bi bi-eye me-1"></i>Open</button>' +
          '<button class="tool" data-a="dl" data-id="' + t.id + '" title="Download" aria-label="Download"><i class="bi bi-download"></i></button>' +
          '<button class="tool del" data-a="del" data-id="' + t.id + '" title="Delete" aria-label="Delete"><i class="bi bi-trash"></i></button></div></article>';
      }).join("");
    }
    function find(id) { return SalinStore.transcripts().filter(function (t) { return t.id === id; })[0]; }
    function download(t) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([asText(t)], { type: "text/plain" }));
      a.download = t.title.replace(/[^\w\-]+/g, "_") + ".txt"; a.click();
    }

    $("rows").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var t = find(+b.dataset.id); if (!t) return;
      if (b.dataset.a === "view") {
        current = t; $("vTitle").textContent = t.title;
        $("vMeta").textContent = (t.condition || "") + " · " + new Date(t.created).toLocaleString();
        $("vBody").innerHTML = t.data.map(function (d) {
          var out = h(d[2]).replace(/\[\[(.+?)\]\]/g, '<span class="low">$1</span>');
          return '<div class="seg" style="animation:none"><div class="ts">' + fmt(d[0]) + '</div><div><span class="chip c-' + d[1] + '">' + LABEL[d[1]] + '</span><p>' + out + '</p></div></div>';
        }).join("");
        bootstrap.Modal.getOrCreateInstance($("view")).show();
      } else if (b.dataset.a === "dl") download(t);
      else if (b.dataset.a === "del" && confirm('Delete "' + t.title + '"?')) { SalinStore.removeTranscript(t.id); render(); }
    });
    $("flt").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      lang = b.dataset.l; [].forEach.call($("flt").children, function (x) { x.classList.toggle("active", x === b); }); render();
    });
    $("vCopy").addEventListener("click", function () { if (current) navigator.clipboard.writeText(asText(current)); });
    $("vDl").addEventListener("click", function () { if (current) download(current); });
    $("q").addEventListener("input", render);
    $("sort").addEventListener("change", render);
    render();
  </script>
</body>
</html>
