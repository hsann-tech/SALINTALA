<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | SalinTala</title>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script src="../js/app.js"></script>
</head>
<body>
  <div class="container-fluid">
    <div class="row">

      <nav class="col-md-3 col-lg-2 sidebar">
        <a class="brand align-items-center" href="../index.html">
          <img src="../images/logo.svg" alt="" width="30" height="30" class="me-2">SalinTala
        </a>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="transcribe.html"><i class="bi bi-upload me-2"></i>New Transcription</a></li>
          <li class="nav-item"><a class="nav-link" href="transcripts.html"><i class="bi bi-journal-text me-2"></i>My Transcripts</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html"><i class="bi bi-chat-square-text me-2"></i>Feedback</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
          <li class="nav-item mt-3"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
        </ul>
      </nav>

      <main class="col-md-9 col-lg-10 p-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
          <div>
            <h2 class="fw-bold mb-0">Profile</h2>
            <span class="muted">Manage your personal details and password</span>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button class="icon-btn" id="theme" title="Toggle theme" style="background:var(--surface);border-color:var(--line);color:var(--ink)"><i class="bi bi-moon-stars"></i></button>
            <a href="transcribe.html" class="btn btn-brand"><i class="bi bi-plus-lg me-1"></i> New Transcription</a>
          </div>
        </div>

        <div class="row g-4">

          <!-- Summary -->
          <div class="col-xl-4">
            <div class="cardx overflow-hidden">
              <div class="profile-cover"></div>
              <div class="p-4 pt-0 text-center">
                <img id="pAvatar" class="avatar-xl" src="../images/avatar.svg" alt="Profile photo">
                <h4 class="fw-bold mt-3 mb-1" id="pName">Your name</h4>
                <span class="chip c-en" id="pRole">Student</span>
                <div class="muted small mt-2" id="pEmail"></div>

                <div class="d-flex gap-2 justify-content-center mt-3">
                  <label class="tool mb-0" for="photo"><i class="bi bi-upload me-1"></i>Change photo</label>
                  <input type="file" id="photo" accept="image/*" class="d-none">
                  <button type="button" class="tool" id="rmPhoto" title="Remove photo"><i class="bi bi-trash"></i></button>
                </div>
                <div class="small mt-2 d-none" id="photoMsg"></div>

                <hr style="border-color:var(--line)">
                <div class="d-flex">
                  <div class="pstat"><b id="sTr">0</b><small>Transcripts saved</small></div>
                  <div class="pstat"><b id="sFb">0</b><small>Feedback sent</small></div>
                  <div class="pstat"><b id="sSince">-</b><small>Member since</small></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Forms -->
          <div class="col-xl-8">
            <div class="cardx p-4 mb-4">
              <div class="hd"><span class="ic"><i class="bi bi-person"></i></span>Personal details</div>
              <div class="alert alert-success py-2 small d-none" id="pOk" role="status"></div>
              <div class="alert alert-danger py-2 small d-none" id="pErr" role="alert"></div>

              <form id="pform">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="fName">Full name</label>
                    <input class="form-control" id="fName" placeholder="Dheniel Nash Baluran" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="fEmail">Email</label>
                    <input class="form-control" id="fEmail" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="fRole">I am a</label>
                    <select class="form-select" id="fRole">
                      <option value="Student">Student</option>
                      <option value="Teacher">Teacher</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="fYear">Year level</label>
                    <select class="form-select" id="fYear">
                      <option value="">Not set</option>
                      <option>1st Year</option>
                      <option>2nd Year</option>
                      <option>3rd Year</option>
                      <option>4th Year</option>
                      <option>Faculty / Staff</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="fProgram">Program / Department</label>
                    <input class="form-control" id="fProgram" placeholder="e.g. BTLED">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="fPhone">Contact number (optional)</label>
                    <input class="form-control" id="fPhone" placeholder="09XX XXX XXXX">
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold" for="fAbout">About me (optional)</label>
                    <textarea class="form-control" id="fAbout" rows="3" placeholder="Tell us a little about yourself"></textarea>
                  </div>
                </div>
                <button type="submit" class="go go-lg mt-4 px-5"><span>Save changes</span><i class="bi bi-check-lg"></i></button>
              </form>
            </div>

            <div class="cardx p-4">
              <div class="hd"><span class="ic"><i class="bi bi-lock"></i></span>Change password</div>
              <div class="alert alert-success py-2 small d-none" id="wOk" role="status"></div>
              <div class="alert alert-danger py-2 small d-none" id="wErr" role="alert"></div>

              <form id="wform">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label small fw-semibold" for="wCur">Current password</label>
                    <input type="password" class="form-control" id="wCur" autocomplete="current-password" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="wNew">New password</label>
                    <input type="password" class="form-control" id="wNew" minlength="6" autocomplete="new-password" placeholder="At least 6 characters" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold" for="wCon">Confirm new password</label>
                    <input type="password" class="form-control" id="wCon" minlength="6" autocomplete="new-password" required>
                  </div>
                </div>
                <button type="submit" class="tool mt-4"><i class="bi bi-shield-lock me-1"></i>Update password</button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var DEFAULT_AVATAR = "../images/avatar.svg";

    function show(id, msg) { $(id).textContent = msg; $(id).classList.remove("d-none"); }
    function hide() { ["pOk", "pErr", "wOk", "wErr"].forEach(function (i) { $(i).classList.add("d-none"); }); }
    function photoMsg(msg, bad) {
      var el = $("photoMsg"); el.textContent = msg; el.style.color = bad ? "#dc3545" : "var(--brand)"; el.classList.remove("d-none");
      setTimeout(function () { el.classList.add("d-none"); }, 3000);
    }

    function load() {
      var p = SalinAuth.profile(); if (!p) return;
      $("pName").textContent = p.name;
      $("pEmail").textContent = p.email;
      $("pRole").textContent = p.role;
      $("pRole").className = "chip " + (p.role === "Teacher" ? "c-ceb" : "c-en");
      $("pAvatar").src = p.photo || DEFAULT_AVATAR;
      $("fName").value = p.name; $("fEmail").value = p.email; $("fRole").value = p.role;
      $("fYear").value = p.year; $("fProgram").value = p.program; $("fPhone").value = p.phone; $("fAbout").value = p.about;
      $("sTr").textContent = SalinStore.transcripts().filter(function (t) { return !t.sample; }).length;
      $("sFb").textContent = SalinStore.feedback().length;
      $("sSince").textContent = p.created ? new Date(p.created).toLocaleDateString(undefined, { month: "short", year: "numeric" }) : "-";
    }

    $("pform").addEventListener("submit", function (e) {
      e.preventDefault(); hide();
      try {
        SalinAuth.updateProfile({ name: $("fName").value, role: $("fRole").value, year: $("fYear").value,
          program: $("fProgram").value, phone: $("fPhone").value, about: $("fAbout").value });
        load(); show("pOk", "Profile saved.");
      } catch (err) { show("pErr", err.message); }
    });

    // Photo: crop to a square and shrink so it saves quickly
    $("photo").addEventListener("change", function () {
      var f = this.files[0], input = this; if (!f) return;
      if (!/^image\//.test(f.type)) { photoMsg("Please choose an image file.", true); input.value = ""; return; }
      var r = new FileReader();
      r.onload = function () {
        var img = new Image();
        img.onload = function () {
          var s = Math.min(img.width, img.height), c = document.createElement("canvas");
          c.width = c.height = 200;
          c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 200, 200);
          try { SalinAuth.updateProfile({ photo: c.toDataURL("image/jpeg", 0.85) }); load(); photoMsg("Photo updated."); }
          catch (err) { photoMsg(err.message, true); }
          input.value = "";
        };
        img.onerror = function () { photoMsg("That image could not be read.", true); input.value = ""; };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
    $("rmPhoto").addEventListener("click", function () {
      try { SalinAuth.updateProfile({ photo: "" }); load(); photoMsg("Photo removed."); } catch (err) { photoMsg(err.message, true); }
    });

    $("wform").addEventListener("submit", function (e) {
      e.preventDefault(); hide();
      if ($("wNew").value !== $("wCon").value) { show("wErr", "New passwords do not match."); return; }
      SalinAuth.changePassword($("wCur").value, $("wNew").value)
        .then(function () { $("wform").reset(); show("wOk", "Password updated."); })
        .catch(function (err) { show("wErr", err.message); });
    });

    load();
  </script>
</body>
</html>
